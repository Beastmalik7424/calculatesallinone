name: Query Calculator live production browser verification
on:
  push:
    branches:
      - "fix/query-live-121-browser-verification"
jobs:
  live-query-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live production Query Calculator
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            try {
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              const pageErrors = [];
              page.on("pageerror", error => pageErrors.push(error.message));
              const response = await page.goto("https://calculateallinone.vercel.app/query-calculator/", { waitUntil: "domcontentloaded", timeout: 60000 });
              assert.equal(response && response.status(), 200, "Production page must return HTTP 200");
              const input = page.locator("#qt-question");
              const result = page.locator("#qt-result");
              assert.equal(await input.count(), 1, "Query input must exist");
              assert.equal(await result.count(), 1, "Query result area must exist");
              const cases = [
                "121 month mn kitny years and days and hours hoty hn",
                "121 months in years days and hours"
              ];
              for (const question of cases) {
                await input.fill(question);
                await input.press("Enter");
                await page.waitForFunction(() => /121 months =/.test(document.querySelector("#qt-result")?.innerText || ""), { timeout: 10000 });
                const actual = (await result.innerText()).replace(/\s+/g, " ").trim();
                console.log("INPUT:", question);
                console.log("LIVE RESULT:", actual);
                assert.match(actual, /10 years and 1 month/i, "Must show 10 years and 1 month");
                assert.match(actual, /3,682\.86 days/, "Must show 3,682.86 average days");
                assert.match(actual, /88,388\.73 hours/, "Must show 88,388.73 average hours");
              }
              assert.deepEqual(pageErrors, [], "Production page must not raise uncaught JavaScript errors");
              console.log("PASS: live production browser interaction, Roman Urdu + English, years/months/days/hours, no uncaught page errors.");
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
