name: Build and smoke test

on:
  push:
    branches: ["main", "fix/**", "seo-seven-pages"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Test hardened braces dependency
        run: node tests/braces-hardening-smoke.cjs
      - name: Audit all dependencies including build-time packages
        run: npm audit --audit-level=moderate
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Test calculator behavior
        run: node tests/calculator-smoke.cjs
      - name: Test input validation
        run: node tests/input-validation-smoke.cjs
      - name: Check Python syntax
        run: python -m py_compile build.py content_v5.py content_v13.py lang_v6.py urdu_v5.py
      - name: Build the site
        run: npm run build
      - name: Test percentage, fraction, compound interest and date engines
        run: node tests/extra-calculators-smoke.cjs
      - name: Validate generated inline scripts against CSP hashes
        run: python3 tests/csp-inline-hash-smoke.py
      - name: Validate sitemap XML with xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout public/sitemap.xml
          echo "xmllint: sitemap XML valid"
      - name: Smoke-test generated pages
        run: |
          test -s public/index.html
          test -s public/ur/index.html
          test -s public/sitemap.xml
          test -s public/robots.txt
          grep -q 'Standard Calculator' public/index.html
          grep -q 'Free' public/index.html
          grep -q 'محفوظ' public/ur/index.html
          test -s public/assets/og-image.png
          grep -q '/assets/og-image.png' public/index.html
          python -c "import struct; p=open('public/assets/og-image.png', 'rb').read(24); assert p[:8] == bytes([137,80,78,71,13,10,26,10]) and struct.unpack('>II', p[16:24]) == (1200,630)"
          test -s public/assets/og-image.svg
          grep -q '/standard-calculator/' public/sitemap.xml
          grep -q 'href="https://calculateallinone.vercel.app/standard-calculator/"' public/standard-calculator/index.html
          grep -q 'href="/ur/zakat-calculator/"' public/zakat-calculator/index.html
          grep -q 'href="/zakat-calculator/"' public/ur/zakat-calculator/index.html
          grep -q 'PRIVATE BY DESIGN' public/index.html
          python -c "import os,pathlib; client=os.environ.get('ADSENSE_CLIENT','ca-pub-9453966537556063').strip(); expected='google.com, '+client.removeprefix('ca-')+', DIRECT, f08c47fec0942fa0'; assert pathlib.Path('public/ads.txt').read_text(encoding='utf-8').strip() == expected, 'ads.txt must match the configured publisher ID'"
          if grep -Eq 'Ø|Ù|Ã|âŒ|âˆ|Â©' public/ur/index.html; then echo 'Mojibake found in Urdu home page'; exit 1; fi
          if grep -Eq 'âŒ«|Ã·|Ã—|âˆ’' public/index.html; then echo 'Corrupted calculator symbols found'; exit 1; fi
      - name: Verify sitemap coverage and internal links
        run: python tests/site-output-smoke.py
      - name: Audit the seven scoped SEO pages
        run: python3 tests/seo-seven-pages.py
      - name: Validate HTML for homepage and seven scoped pages
        run: python3 tests/validate-html.py
      - name: Validate explicit HTTP 301 redirect configuration
        run: python tests/vercel-redirect-config-smoke.py
      - name: Lighthouse SEO audit on built pages
        run: |
          python3 -m http.server 4173 --directory public >/tmp/calculateall-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=seo --output=json --output-path=/tmp/lighthouse-home.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/bmi-calculator/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=seo --output=json --output-path=/tmp/lighthouse-bmi.json
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/zakat-calculator/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=seo --output=json --output-path=/tmp/lighthouse-zakat.json
          node -e 'const fs=require("node:fs"); for (const name of ["home","bmi","zakat"]) { const r=JSON.parse(fs.readFileSync("/tmp/lighthouse-"+name+".json","utf8")); const score=r.categories.seo.score; console.log("Lighthouse SEO "+name+": "+Math.round(score*100)+"/100"); if (score !== 1) process.exitCode=1; }'
      - name: Lighthouse SEO audit for seven scoped pages
        run: |
          python3 -m http.server 4175 --directory public >/tmp/calculateall-http-seven.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          node -e 'const fs=require("node:fs"); const paths=["/ar/","/es/","/fr/","/contact/","/discount-calculator/","/editorial-policy/","/health/"]; fs.writeFileSync("/tmp/seo-seven-paths.json",JSON.stringify(paths));'
          for path in /ar/ /es/ /fr/ /contact/ /discount-calculator/ /editorial-policy/ /health/; do
            slug=$(echo "$path" | tr -cd '[:alnum:]')
            npx --yes lighthouse@12.8.2 "http://127.0.0.1:4175$path" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=seo --output=json --output-path="/tmp/lh-seven-$slug.json"
          done
          node -e 'const fs=require("node:fs"); const paths=["/ar/","/es/","/fr/","/contact/","/discount-calculator/","/editorial-policy/","/health/"]; let bad=0; for(const path of paths){const slug=path.replace(/[^a-z0-9]/gi,"");const r=JSON.parse(fs.readFileSync("/tmp/lh-seven-"+slug+".json","utf8"));const refs=new Set(r.categories.seo.auditRefs.map(x=>x.id));const failed=Object.entries(r.audits).filter(([id,a])=>refs.has(id)&&a.score===0).map(([id])=>id);const expectedNoindex=["/ar/","/es/","/fr/"].includes(path);const unexpected=failed.filter(id=>!(expectedNoindex&&id==="is-crawlable"));console.log(path+" Lighthouse SEO "+Math.round(r.categories.seo.score*100)+"/100; failed SEO audits: "+(failed.join(",")||"none"));if(unexpected.length){console.error("Unexpected failed audits on "+path+": "+unexpected.join(","));bad=1;}} if(bad)process.exit(1); console.log("Lighthouse scoped-page audit: PASS; only expected is-crawlable findings are allowed on intentionally noindex language pages.");'
      - name: Test headless browser console on seven scoped pages
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4174 --directory public >/tmp/calculateall-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/seo-seven-pages-browser.cjs
          node tests/extra-calculators-browser.cjs
      # Protected Vercel previews are verified separately through the authenticated Vercel connector.
      - name: Test safe monetization configuration
        run: python tests/monetization-smoke.py
