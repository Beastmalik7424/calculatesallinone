name: First-screen calculator browser audit
on:
  pull_request:
    paths:
      - 'build.py'
      - 'content_v5.py'
      - 'tests/all-calculator-smoke.cjs'
      - 'tests/site-output-smoke.py'
      - 'calorie_calculator.py'
      - 'static/calorie-calculator.js'
      - 'tests/calorie-calculator-browser.cjs'
      - 'emi-calculator.html'
      - 'tests/emi-viewport-audit.cjs'
      - 'styles/input.css'
      - 'static/app.js'
      - 'tests/viewport-audit.cjs'
      - 'tests/query-calculator-browser.cjs'
      - 'extra_calculator_pages.py'
      - 'static/extra-calculators.js'
      - 'static/extra-calculators-ui.js'
      - 'tests/extra-calculators-browser.cjs'
      - 'tests/extra-calculators-smoke.cjs'
      - '.github/workflows/first-screen-audit.yml'
  workflow_dispatch:
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Node and Python runtime contract
        run: python3 tests/runtime-contract-smoke.py
      - name: Test Playwright lockfile contract
        run: python3 tests/playwright-lock-contract-smoke.py
      - name: Install locked dependencies
        run: npm ci
      - name: Build site and run smoke tests
        run: npm run build
      - name: Verify locked Playwright version
        run: node -e 'const v=require("playwright/package.json").version; if(v!=="1.64.1") throw new Error("Expected locked Playwright 1.64.1, got "+v); console.log("Locked Playwright version: "+v);'
      - name: Install Chromium for locked Playwright
        run: npx playwright install --with-deps chromium
      - name: Audit actual rendered first-screen buttons and profit calculations
        run: |
          python3 -m http.server 8123 --directory public >/tmp/site-server.log 2>&1 &
          node tests/viewport-audit.cjs
          node tests/emi-viewport-audit.cjs
          python3 -m http.server 4174 --directory public >/tmp/calorie-browser-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/calorie-calculator/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/calorie-calculator/ >/dev/null
          node tests/calorie-calculator-browser.cjs
          node tests/query-calculator-browser.cjs
          node tests/extra-calculators-browser.cjs
      - name: Save actual first-screen screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-screen-screenshots
          path: /tmp/*-*.png
          if-no-files-found: warn
          retention-days: 7
