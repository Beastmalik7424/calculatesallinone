name: First-screen calculator browser audit
on:
  pull_request:
    paths:
      - 'build.py'
      - 'emi-calculator.html'
      - 'tests/emi-viewport-audit.cjs'
      - 'styles/input.css'
      - 'static/app.js'
      - 'tests/viewport-audit.cjs'
      - '.github/workflows/first-screen-audit.yml'
  workflow_dispatch:
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Audit actual rendered first-screen buttons and profit calculations
        run: |
          python3 -m http.server 8123 --directory public >/tmp/site-server.log 2>&1 &
          node tests/viewport-audit.cjs
          node tests/emi-viewport-audit.cjs
      - name: Save actual first-screen screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-screen-screenshots
          path: /tmp/*-*.png
          if-no-files-found: warn
          retention-days: 7
