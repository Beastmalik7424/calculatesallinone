name: First-screen calculator browser audit
on:
  pull_request:
    paths:
      - 'build.py'
      - 'content_v5.py'
      - 'tests/all-calculator-smoke.cjs'
      - 'tests/site-output-smoke.py'
      - 'calorie_calculator.py'
      - 'static/calorie-calculator.js'
      - 'tests/calorie-calculator-browser.cjs'
      - 'emi-calculator.html'
      - 'tests/emi-viewport-audit.cjs'
      - 'styles/input.css'
      - 'static/app.js'
      - 'static/zakat-calculator.js'
      - 'tests/zakat-calculator-browser.cjs'
      - 'tests/zakat-fiqh-methods.cjs'
      - 'tests/zakat-calculator-quality-smoke.cjs'
      - 'tests/viewport-audit.cjs'
      - 'tests/query-calculator-browser.cjs'
      - 'extra_calculator_pages.py'
      - 'static/extra-calculators.js'
      - 'static/extra-calculators-ui.js'
      - 'tests/extra-calculators-browser.cjs'
      - 'tests/all-calculator-layout-browser.cjs'
      - 'tests/extra-calculators-smoke.cjs'
      - '.github/workflows/first-screen-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test Node and Python runtime contract
        run: python3 tests/runtime-contract-smoke.py
      - name: Test workflow least-privilege permissions
        run: python3 tests/workflow-security-contract.py
      - name: Test Playwright lockfile contract
        run: python3 tests/playwright-lock-contract-smoke.py
      - name: Install locked dependencies
        run: npm ci
      - name: Build site and run smoke tests
        run: npm run build
      - name: Verify locked Playwright version
        run: |
          node -e 'const v=require("playwright/package.json").version; if(v!=="1.64.1") throw new Error("Expected locked Playwright 1.64.1, got "+v); console.log("Locked Playwright version:",v);'
      - name: Install Chromium for locked Playwright
        run: npx playwright install --with-deps chromium
      - name: Start local browser-test servers
        run: |
          python3 -m http.server 8123 --directory public >/tmp/site-server.log 2>&1 &
          python3 -m http.server 4174 --directory public >/tmp/calorie-browser-server.log 2>&1 &
          for port in 8123 4174; do
            ready=false
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/zakat-calculator/" >/dev/null; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true || { echo "Local browser-test server failed on port $port"; cat /tmp/site-server.log /tmp/calorie-browser-server.log; exit 1; }
          done
      - name: Audit Zakat first-screen navigation and profit interactions
        run: timeout 240s node tests/viewport-audit.cjs
      - name: Audit EMI viewport and calculator placement
        run: timeout 180s node tests/emi-viewport-audit.cjs
      - name: Audit Zakat English and Urdu browser flows
        run: timeout 240s node tests/zakat-calculator-browser.cjs
      - name: Audit calorie calculator browser flow
        run: timeout 180s node tests/calorie-calculator-browser.cjs
      - name: Audit query calculator browser flow
        run: timeout 180s node tests/query-calculator-browser.cjs
      - name: Audit extra calculator browser regressions
        run: timeout 240s node tests/extra-calculators-browser.cjs
      - name: Audit every calculator first-screen layout
        run: timeout 420s node tests/all-calculator-layout-browser.cjs
      - name: Save actual first-screen screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-screen-screenshots
          path: /tmp/*-*.png
          if-no-files-found: warn
          retention-days: 7
