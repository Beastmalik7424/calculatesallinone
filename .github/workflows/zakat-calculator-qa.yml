name: Zakat calculator QA

on:
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "tests/zakat-calculator-browser.cjs"
      - "tests/zakat-calculator-quality-smoke.cjs"
      - "styles/input.css"
      - "static/app.js"
      - "static/zakat-calculator.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/zakat-calculator-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zakat-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Generate site
        run: python3 build.py

      - name: Run complete project build and regression suite
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve generated site
        run: |
          python3 -m http.server 4174 --directory public > /tmp/zakat-http.log 2>&1 &
          echo $! > /tmp/zakat-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/zakat-calculator/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zakat-http.log
          exit 1

      - name: Run English and Urdu Playwright browser QA
        env:
          BASE_URL: http://127.0.0.1:4174
        run: node tests/zakat-calculator-browser.cjs

      - name: Stop local test server
        if: always()
        run: |
          if [ -f /tmp/zakat-http.pid ]; then kill "$(cat /tmp/zakat-http.pid)" || true; fi
