name: Site build and monetization checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Test Node runtime contract
        run: python3 tests/runtime-contract-smoke.py
      - name: Test workflow least-privilege permissions
        run: python3 tests/workflow-security-contract.py
      - name: Test Playwright lockfile contract
        run: python3 tests/playwright-lock-contract-smoke.py
      - name: Install locked dependencies
        run: npm ci
      - name: Build site and run smoke tests
        run: npm run build
