name: Site build and monetization checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Test Node runtime contract
        run: python3 tests/runtime-contract-smoke.py
      - name: Test Playwright lockfile contract
        run: python3 tests/playwright-lock-contract-smoke.py
      - name: Install locked dependencies
        run: npm ci
      - name: Build site and run smoke tests
        run: npm run build
