name: Zakat focused verification

on:
  push:
    branches: ["fix/zakat-sistani-coins-single-page"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  zakat-focused:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies without repeating the separate security audit
        run: npm ci --no-audit --ignore-scripts
      - name: Check Zakat JavaScript syntax
        run: node --check static/app.js && node --check static/zakat-calculator.js
      - name: Build CSS and generated pages
        run: npm run build:css && python3 build.py && python3 seo_finalize.py
      - name: Run Zakat calculation and deterministic fiqh tests
        run: node tests/zakat-fiqh-methods.cjs
      - name: Run Zakat page, localization and quality tests
        run: node tests/zakat-calculator-quality-smoke.cjs && python3 tests/site-output-smoke.py
      - name: Run form input and application integration tests
        run: node tests/input-validation-smoke.cjs && node tests/all-calculator-smoke.cjs
      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium
      - name: Run responsive Zakat browser tests
        run: |
          python3 -m http.server 4174 --directory public >/tmp/zakat-focused-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/zakat-calculator/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/zakat-calculator/ >/dev/null
          node tests/zakat-calculator-browser.cjs
